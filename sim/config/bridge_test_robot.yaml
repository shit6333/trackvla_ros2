# ros_gz_bridge configuration.
#
# Only the topics the pipeline actually needs are bridged. Every bridged topic
# costs a serialization round trip, and the world publishes a lot that nothing
# here consumes.

# The model's input.
- ros_topic_name: "/camera/image_raw"
  gz_topic_name: "/front_camera"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

# The chase camera, recorded to a file because there is no display to attach.
- ros_topic_name: "/sim/third_person/image_raw"
  gz_topic_name: "/chase_camera"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

# The only topic that flows the other way.
- ros_topic_name: "/cmd_vel"
  gz_topic_name: "/model/test_robot/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

# Odometry is what makes "the robot moved" checkable. Without it a test can
# only confirm that a command was published, not that anything happened.
- ros_topic_name: "/odom"
  gz_topic_name: "/model/test_robot/odometry"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

# Bridged for observability. The runtime nodes deliberately do not run on it:
# their plan timing uses the wall clock, so simulation is pinned to real time
# instead. See D021.
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# Robot pose, so a viewer can place the robot in a scene rather than only
# plot numbers. Gazebo publishes one Pose_V per model containing that model's
# pose and every link's pose relative to it.
#
# The actor is deliberately absent from this file because Gazebo does not
# publish its pose at all: it appears in neither pose topic, neither in the
# serialized world state, nor in the model list. Actors are rendering
# entities, so the person is visible in the camera images and nowhere else.
# Ground truth, not the wheel odometry. DiffDrive's odometry integrates wheel
# rotation and slips during turns: measured against Gazebo's own pose after a
# few minutes of tracking, it had drifted 3.2 m, which put the robot that far
# from the scene drawn around it. Odometry is still published on /odom and is
# what a real robot would have; this topic exists so a viewer can show where
# the robot actually is.
#
# The PosePublisher plugin on the robot supplies it. The tree it produces is
# rooted at the world's name: tracking -> test_robot -> test_robot::base_link.
#
# Simulation only. There is no equivalent on hardware, and anything that comes
# to depend on it will not survive the move.
- ros_topic_name: "/tf"
  gz_topic_name: "/model/test_robot/pose"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS
